name: Regenerate selected historical BFA snapshots

on:
  push:
    branches:
      - revamp/trends-dashboard
    paths:
      - .github/workflows/regenerate-historical-2022-2024.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Record the two season files that must remain untouched
        run: |
          echo "HASH_2025=$(git hash-object static/season_matchups/2025.json)" >> "$GITHUB_ENV"
          echo "HASH_2026=$(git hash-object static/season_matchups/2026.json)" >> "$GITHUB_ENV"

      - name: Regenerate only 2022, 2023, and 2024
        run: node scripts/regenerate-season-matchups.mjs 2022 2023 2024

      - name: Validate generated files and protect 2025 and 2026
        run: |
          test "$(git hash-object static/season_matchups/2025.json)" = "$HASH_2025"
          test "$(git hash-object static/season_matchups/2026.json)" = "$HASH_2026"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';

          const expected = {
            2022: { playoff_week_start: 20, playoff_week_end: 22, playoff_teams: 6, toilet_bowl_teams: 8 },
            2023: { playoff_week_start: 21, playoff_week_end: 23, playoff_teams: 8, toilet_bowl_teams: 6 },
            2024: { playoff_week_start: 21, playoff_week_end: 23, playoff_teams: 8, toilet_bowl_teams: 6 },
          };

          for (const [year, metadata] of Object.entries(expected)) {
            const file = JSON.parse(fs.readFileSync(`static/season_matchups/${year}.json`, 'utf8'));
            for (const [key, value] of Object.entries(metadata)) {
              assert.equal(file[key], value, `${year}: incorrect ${key}`);
            }

            const weeks = Object.keys(file).filter((key) => /^\d+$/.test(key));
            assert.ok(weeks.length >= metadata.playoff_week_end, `${year}: missing season weeks`);
            let matchups = 0;
            for (const week of weeks) {
              const rows = file[week];
              assert.ok(Array.isArray(rows) && rows.length > 0, `${year} week ${week}: empty matchup list`);
              for (const row of rows) {
                assert.equal(Number(row.week), Number(week), `${year} week ${week}: row week mismatch`);
                assert.ok(row.teamA?.rosterId && row.teamB?.rosterId, `${year} week ${week}: missing team`);
                assert.ok(Array.isArray(row.teamA.starters), `${year} week ${week}: missing teamA starters`);
                assert.ok(Array.isArray(row.teamA.starters_points), `${year} week ${week}: missing teamA starter points`);
                assert.ok(Array.isArray(row.teamB.starters), `${year} week ${week}: missing teamB starters`);
                assert.ok(Array.isArray(row.teamB.starters_points), `${year} week ${week}: missing teamB starter points`);
                assert.equal(row.teamA.starters.length, row.teamA.starters_points.length, `${year} week ${week}: teamA starter alignment`);
                assert.equal(row.teamB.starters.length, row.teamB.starters_points.length, `${year} week ${week}: teamB starter alignment`);
                if (row.teamAScore != null) assert.ok(Number.isFinite(Number(row.teamAScore)));
                if (row.teamBScore != null) assert.ok(Number.isFinite(Number(row.teamBScore)));
                matchups++;
              }
            }
            console.log(`${year}: validated ${weeks.length} weeks / ${matchups} matchups`);
          }
          NODE

      - name: Commit only the three requested JSON files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/season_matchups/2022.json static/season_matchups/2023.json static/season_matchups/2024.json
          if git diff --cached --quiet; then
            echo "The three requested snapshots were regenerated and are already identical."
          else
            git commit -m "Regenerate 2022-2024 season matchup snapshots"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
